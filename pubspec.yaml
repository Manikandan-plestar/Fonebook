name: fonebook
description: "Fone Book is a modern-day global telephone directory app that contains the contacts information of individuals, professionals, organizations and freelancers."
publish_to: 'none'

version: 1.0.8+45

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.3
  image_picker: ^1.2.2
  intl: ^0.20.2
  in_app_purchase: ^3.3.0
  geocoding: ^5.0.0
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  country_state_city: ^0.1.6
  flutter_contacts: ^2.1.0
  call_log: ^6.0.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/big-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/big-icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
